name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Regenerate manifest and check for drift
        run: |
          pnpm run generate-manifest
          git diff --exit-code content/manifest.json

      - name: Content lint
        run: pnpm test:content

      - name: Build
        run: pnpm build
        env:
          AUTH_SECRET: ci-build-secret-not-for-production
          AUTH_URL: http://localhost:3000
          AUTH_TRUST_HOST: "true"

      - name: Install Playwright browser
        run: pnpm exec playwright install chromium --with-deps

      - name: E2e tests
        run: pnpm test:e2e
        env:
          CI: true
          PLAYWRIGHT_PORT: 3010
          AUTH_SECRET: ci-build-secret-not-for-production
          AUTH_URL: http://127.0.0.1:3010
          AUTH_TRUST_HOST: "true"
          AUTH_DEV_LOGIN: "1"
